{% extends "base.html" %}
{% block title %}Reset password | HireSphere{% endblock %}
{% block content %}<section class="auth-page"><div class="auth-card"><a class="auth-back" href="{{ url_for('auth.login') }}">← Back to login</a><div class="auth-logo">H</div><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Set a new password</h1><p class="auth-subtitle">Choose a password with at least 8 characters.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label for="password">New password</label><input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required></div><div class="form-field"><label for="confirm_password">Confirm new password</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="auth-submit" type="submit">Reset password →</button></form></div></section>{% endblock %}
