{% extends "base.html" %}{% block title %}Log in | HireSphere{% endblock %}
{% block content %}<section class="auth-page"><div class="auth-card"><a class="auth-back" href="{{ url_for('public.home') }}">← Back to home</a><div class="auth-logo">H</div><span class="eyebrow">WELCOME BACK</span><h1>Log in to HireSphere</h1><p class="auth-subtitle">Continue to your recruitment workspace.</p>
<form method="post" action="{{ url_for('auth.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" required></div><div class="form-field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="auth-submit" type="submit">Log in →</button></form><p class="auth-switch"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p><p class="auth-switch">New to HireSphere? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></section>{% endblock %}
