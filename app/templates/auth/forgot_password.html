{% extends "base.html" %}
{% block title %}Forgot password | HireSphere{% endblock %}
{% block content %}<section class="auth-page"><div class="auth-card"><a class="auth-back" href="{{ url_for('auth.login') }}">← Back to login</a><div class="auth-logo">H</div><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Forgot your password?</h1><p class="auth-subtitle">Enter your account email. If it is registered and SMTP email is configured, we will send a time-limited reset link.</p><form method="post" action="{{ url_for('auth.forgot_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" maxlength="255" required></div><button class="auth-submit" type="submit">Send reset link →</button></form></div></section>{% endblock %}
